<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Berry Snake</title><link rel="stylesheet" href="common.css"></head>
<body>
<canvas class="game" id="c" width="1920" height="1080"></canvas>
<div class="hud"><div id="score">Score 0</div><div id="best">Best 0</div></div>
<div class="overlay" id="ov"><h1>Berry Snake</h1><p>Eat the raspberries, don't bite your tail.</p><p class="big" id="ov-msg"></p>
  <p class="keys">▲ ▼ ◀ ▶ steer · <b>OK</b> start · Back exit</p></div>
<script src="common.js"></script>
<script>
'use strict';
const C = PV.$('#c'), g = C.getContext('2d');
const CELL = 60, COLS = 32, ROWS = 16, OX = 0, OY = 120;
let snake, dir, nextDir, berry, score = 0, state = 'ready', tick = 0, speed;
function reset() {
  snake = [{ x: 8, y: 8 }, { x: 7, y: 8 }, { x: 6, y: 8 }]; dir = { x: 1, y: 0 }; nextDir = dir; score = 0; speed = 0.14; place(); state = 'play';
  PV.$('#ov').classList.add('hidden');
}
function place() {
  do { berry = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) }; } while (snake.some((s) => s.x === berry.x && s.y === berry.y));
}
PV.onPress((k) => {
  if (state !== 'play') { if (k === 'ok') reset(); return; }
  const d = { up: { x: 0, y: -1 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } }[k];
  if (d && (d.x !== -dir.x || d.y !== -dir.y)) nextDir = d;
});
function update(dt) {
  if (state !== 'play') return;
  tick += dt; if (tick < speed) return; tick = 0;
  dir = nextDir;
  const head = { x: (snake[0].x + dir.x + COLS) % COLS, y: (snake[0].y + dir.y + ROWS) % ROWS };
  if (snake.some((s) => s.x === head.x && s.y === head.y)) {
    state = 'over'; PV.best('snake', score);
    PV.$('#ov-msg').textContent = `Game over · ${score} points`; PV.$('#ov').classList.remove('hidden'); return;
  }
  snake.unshift(head);
  if (head.x === berry.x && head.y === berry.y) { score += 10; speed = Math.max(0.06, speed - 0.004); place(); } else snake.pop();
}
function render() {
  g.fillStyle = '#120a16'; g.fillRect(0, 0, 1920, 1080);
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) { g.fillStyle = (x + y) % 2 ? '#1b1020' : '#1f1325'; g.fillRect(OX + x * CELL, OY + y * CELL, CELL, CELL); }
  if (!snake) return;
  // berry
  const bx = OX + berry.x * CELL + 30, by = OY + berry.y * CELL + 32, t = performance.now() / 300;
  g.fillStyle = '#e0115f';
  for (const [dx, dy] of [[-8, -6], [8, -6], [0, -12], [-10, 6], [10, 6], [0, 2], [0, 14]]) { g.beginPath(); g.arc(bx + dx, by + dy + Math.sin(t) * 2, 9, 0, 7); g.fill(); }
  g.fillStyle = '#3fbf5a'; g.fillRect(bx - 4, by - 26, 8, 10);
  // snake
  snake.forEach((s, i) => {
    const f = 1 - i / (snake.length + 6);
    g.fillStyle = `hsl(${145 - i * 1.5}, 65%, ${32 + f * 22}%)`;
    const pad = i === 0 ? 3 : 7; g.beginPath(); g.roundRect(OX + s.x * CELL + pad, OY + s.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 14); g.fill();
  });
  const h = snake[0]; g.fillStyle = '#fff';
  for (const o of [-1, 1]) { g.beginPath(); g.arc(OX + h.x * CELL + 30 + dir.y * o * 12 + dir.x * 8, OY + h.y * CELL + 30 + dir.x * o * 12 + dir.y * 8, 7, 0, 7); g.fill(); }
  PV.$('#score').textContent = `Score ${score}`; PV.$('#best').textContent = `Best ${PV.best('snake')}`;
}
PV.$('#best').textContent = `Best ${PV.best('snake')}`;
snake = [{ x: 8, y: 8 }, { x: 7, y: 8 }, { x: 6, y: 8 }]; dir = { x: 1, y: 0 }; berry = { x: 20, y: 8 };
PV.loop(update, render);
</script>
</body>
</html>
