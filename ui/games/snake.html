<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Berry Snake</title><link rel="stylesheet" href="common.css"></head>
<body>
<canvas class="game" id="c" width="1920" height="1080"></canvas>
<div class="hud"><div id="score">Score 0</div><div id="best">Best 0</div></div>
<div class="overlay" id="ov"><h1>Berry Snake</h1><p data-i18n>Eat the raspberries, don't bite your tail.</p><p class="big" id="ov-msg"></p>
  <p class="keys" data-i18n-html>▲ ▼ ◀ ▶ steer · <b>OK</b> start · Back exit</p></div>
<script src="/shared/i18n.js"></script>
<script src="common.js"></script>
<script src="render.js"></script>
<script>
'use strict';
const C = PV.$('#c');
const CELL = 60, COLS = 32, ROWS = 16, OX = 0, OY = 120;
let snake, dir, nextDir, berry, score = 0, state = 'ready', tick = 0, speed;
function reset() {
  snake = [{ x: 8, y: 8 }, { x: 7, y: 8 }, { x: 6, y: 8 }]; dir = { x: 1, y: 0 }; nextDir = dir; score = 0; speed = 0.14; place(); state = 'play';
  PV.$('#ov').classList.add('hidden');
}
function place() {
  do { berry = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) }; } while (snake.some((s) => s.x === berry.x && s.y === berry.y));
}
PV.onPress((k) => {
  if (state !== 'play') { if (k === 'ok') reset(); return; }
  const d = { up: { x: 0, y: -1 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } }[k];
  if (d && (d.x !== -dir.x || d.y !== -dir.y)) nextDir = d;
});
function update(dt) {
  if (state !== 'play') return;
  tick += dt; if (tick < speed) return; tick = 0;
  dir = nextDir;
  const head = { x: (snake[0].x + dir.x + COLS) % COLS, y: (snake[0].y + dir.y + ROWS) % ROWS };
  if (snake.some((s) => s.x === head.x && s.y === head.y)) {
    state = 'over'; PV.best('snake', score);
    PV.$('#ov-msg').textContent = t('Game over · {n} points', { n: score }); PV.$('#ov').classList.remove('hidden'); return;
  }
  snake.unshift(head);
  if (head.x === berry.x && head.y === berry.y) { score += 10; speed = Math.max(0.06, speed - 0.004); place(); } else snake.pop();
}
// GPU sprites (WebGL batch renderer; Canvas-2D fallback)
const R = PVRender.create(C);
const mk = (w, h, f) => { const c = document.createElement('canvas'); c.width = w; c.height = h; f(c.getContext('2d')); return R.texture(c); };
const SEGT = mk(64, 64, (x) => { x.fillStyle = '#fff'; x.beginPath(); x.roundRect(2, 2, 60, 60, 16); x.fill(); x.fillStyle = 'rgba(255,255,255,.35)'; x.fillRect(12, 10, 40, 8); });
const DOT = mk(32, 32, (x) => { x.fillStyle = '#fff'; x.beginPath(); x.arc(16, 16, 15, 0, 7); x.fill(); });
const BERRY = mk(64, 72, (x) => { x.fillStyle = '#e0115f'; for (const [dx, dy] of [[-8, -6], [8, -6], [0, -12], [-10, 6], [10, 6], [0, 2], [0, 14]]) { x.beginPath(); x.arc(32 + dx, 40 + dy, 10, 0, 7); x.fill(); }
  x.fillStyle = '#ff8fb5'; x.beginPath(); x.arc(26, 30, 4, 0, 7); x.fill(); x.fillStyle = '#3fbf5a'; x.fillRect(28, 4, 8, 14); });
let lastScore = -1;
function render() {
  R.begin('#120a16');
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if ((x + y) % 2) R.rect(OX + x * CELL, OY + y * CELL, CELL, CELL, '#1b1020'); else R.rect(OX + x * CELL, OY + y * CELL, CELL, CELL, '#1f1325');
  if (snake) {
    const t = performance.now() / 300;
    R.image(BERRY, OX + berry.x * CELL - 2, OY + berry.y * CELL - 8 + Math.sin(t) * 2, 64, 72);
    snake.forEach((sg, i) => {
      const f = 1 - i / (snake.length + 6); const pad = i === 0 ? 2 : 6;
      R.image(SEGT, OX + sg.x * CELL + pad, OY + sg.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, { tint: `hsl(${145 - i * 1.5}, 65%, ${32 + f * 22}%)` });
    });
    const h = snake[0];
    for (const o of [-1, 1]) R.image(DOT, OX + h.x * CELL + 30 + dir.y * o * 12 + dir.x * 8 - 7, OY + h.y * CELL + 30 + dir.x * o * 12 + dir.y * 8 - 7, 14, 14);
  }
  R.end();
  if (score !== lastScore) { lastScore = score; PV.$('#score').textContent = t('Score {n}', { n: score }); PV.$('#best').textContent = t('Best {n}', { n: PV.best('snake') }); }
}
PV.$('#best').textContent = t('Best {n}', { n: PV.best('snake') });
snake = [{ x: 8, y: 8 }, { x: 7, y: 8 }, { x: 6, y: 8 }]; dir = { x: 1, y: 0 }; berry = { x: 20, y: 8 };
PV.loop(update, render);
</script>
</body>
</html>
