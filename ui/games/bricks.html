<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Brick Blaster</title><link rel="stylesheet" href="common.css"></head>
<body>
<canvas class="game" id="c" width="1920" height="1080"></canvas>
<div class="hud"><div id="score">Score 0</div><div id="lives">♥♥♥</div><div id="best">Best 0</div></div>
<div class="overlay" id="ov"><h1>Brick Blaster</h1><p data-i18n>Clear every brick. Catch the ball!</p><p class="big" id="ov-msg"></p>
  <p class="keys" data-i18n-html>◀ ▶ hold to move · <b>OK</b> launch · Back exit</p></div>
<script src="/shared/i18n.js"></script>
<script src="common.js"></script>
<script src="render.js"></script>
<script>
'use strict';

const W = 1920, H = 1080, PW = 260, PH = 26, BR = 14;   // BR = ball radius
const COLORS = ['#e0115f', '#ff4d8d', '#f97316', '#facc15', '#4ade80', '#22d3ee', '#a855f7'];
let paddle, ball, bricks, score, lives, level, state = 'ready', stuck = true;
function buildLevel() {
  bricks = [];
  const cols = 12, rows = 5 + Math.min(level, 2), bw = 136, bh = 44, gap = 10, ox = (W - cols * (bw + gap) + gap) / 2;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    if (level % 2 === 0 && (r + c) % 5 === 0) continue;
    bricks.push({ x: ox + c * (bw + gap), y: 150 + r * (bh + gap), w: bw, h: bh, hp: r < level ? 2 : 1, color: COLORS[r % COLORS.length] });
  }
}
function newGame() { score = 0; lives = 3; level = 1; buildLevel(); serve(); state = 'play'; PV.$('#ov').classList.add('hidden'); }
function serve() { paddle = { x: W / 2 - PW / 2, y: H - 80 }; ball = { x: W / 2, y: H - 80 - BR, vx: 0, vy: 0 }; stuck = true; }
PV.onPress((k) => {
  if (state !== 'play') { if (k === 'ok') newGame(); return; }
  if (k === 'ok' && stuck) { stuck = false; const sp = 760 + level * 60; ball.vx = sp * 0.45; ball.vy = -sp * 0.9; }
});
function update(dt) {
  if (state !== 'play') return;
  const v = 1500 * dt;
  if (PV.held('left')) paddle.x -= v; if (PV.held('right')) paddle.x += v;
  paddle.x = Math.max(0, Math.min(W - PW, paddle.x));
  if (stuck) { ball.x = paddle.x + PW / 2; ball.y = paddle.y - BR; return; }
  ball.x += ball.vx * dt; ball.y += ball.vy * dt;
  if (ball.x < BR || ball.x > W - BR) { ball.vx *= -1; ball.x = Math.max(BR, Math.min(W - BR, ball.x)); }
  if (ball.y < 110 + BR) { ball.vy = Math.abs(ball.vy); }
  if (ball.vy > 0 && ball.y + BR >= paddle.y && ball.y + BR <= paddle.y + PH + 20 && ball.x > paddle.x - BR && ball.x < paddle.x + PW + BR) {
    const hit = (ball.x - (paddle.x + PW / 2)) / (PW / 2); const sp = Math.hypot(ball.vx, ball.vy) * 1.01;
    ball.vx = sp * Math.sin(hit * 1.05); ball.vy = -Math.abs(sp * Math.cos(hit * 1.05)); ball.y = paddle.y - BR;
  }
  for (const b of bricks) {
    if (b.hp <= 0) continue;
    if (ball.x + BR > b.x && ball.x - BR < b.x + b.w && ball.y + BR > b.y && ball.y - BR < b.y + b.h) {
      const ox = Math.min(ball.x + BR - b.x, b.x + b.w - (ball.x - BR)), oy = Math.min(ball.y + BR - b.y, b.y + b.h - (ball.y - BR));
      if (ox < oy) ball.vx *= -1; else ball.vy *= -1;
      b.hp--; score += 10 * level; break;
    }
  }
  bricks = bricks.filter((b) => b.hp > 0);
  if (!bricks.length) { level++; buildLevel(); serve(); }
  if (ball.y > H + 40) {
    lives--;
    if (lives <= 0) { state = 'over'; PV.best('bricks', score); PV.$('#ov-msg').textContent = t('Game over · {n} points', { n: score }); PV.$('#ov').classList.remove('hidden'); }
    else serve();
  }
}
// GPU sprites (WebGL batch renderer; Canvas-2D fallback)
const R = PVRender.create(PV.$('#c'));
const mk = (w, h, f) => { const c = document.createElement('canvas'); c.width = w; c.height = h; f(c.getContext('2d')); return R.texture(c); };
const BRICK = mk(136, 44, (x) => { x.fillStyle = '#fff'; x.beginPath(); x.roundRect(0, 0, 136, 44, 10); x.fill(); x.fillStyle = 'rgba(255,255,255,.55)'; x.fillRect(8, 6, 120, 8); });
const BRICK2 = mk(136, 44, (x) => { x.fillStyle = '#fff'; x.beginPath(); x.roundRect(0, 0, 136, 44, 10); x.fill(); x.strokeStyle = '#333'; x.lineWidth = 5; x.beginPath(); x.roundRect(3, 3, 130, 38, 8); x.stroke(); });
const PADDLE = mk(PW, PH, (x) => { const g = x.createLinearGradient(0, 0, PW, 0); g.addColorStop(0, '#ff4d8d'); g.addColorStop(1, '#a855f7'); x.fillStyle = g; x.beginPath(); x.roundRect(0, 0, PW, PH, 13); x.fill(); });
const BALL = mk(64, 64, (x) => { const g = x.createRadialGradient(32, 32, 0, 32, 32, 32); g.addColorStop(0, '#fff'); g.addColorStop(0.42, '#fff'); g.addColorStop(0.5, 'rgba(255,255,255,.45)'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0, 0, 64, 64); });
let hudKey = '';
function render() {
  R.begin('#07040a');
  R.grad(0, 0, W, H, '#1a0b22', '#07040a');
  if (bricks) {
    for (const b of bricks) R.image(b.hp > 1 ? BRICK2 : BRICK, b.x, b.y, b.w, b.h, { tint: b.color, alpha: b.hp > 1 ? 1 : 0.9 });
    R.image(PADDLE, paddle.x, paddle.y, PW, PH);
    R.image(BALL, ball.x - 32, ball.y - 32, 64, 64);
  }
  R.end();
  const k = [score, level, lives].join();
  if (bricks && k !== hudKey) {
    hudKey = k; PV.$('#score').textContent = t('Score {n}  ·  Level {l}', { n: score, l: level }); PV.$('#lives').textContent = '♥'.repeat(Math.max(0, lives));
    PV.$('#best').textContent = t('Best {n}', { n: PV.best('bricks') });
  }
}
level = 1; buildLevel(); serve(); score = 0; lives = 3;
PV.$('#best').textContent = t('Best {n}', { n: PV.best('bricks') });
PV.loop(update, render);
</script>
</body>
</html>
