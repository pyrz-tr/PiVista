<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Berry Merge</title><link rel="stylesheet" href="common.css">
<style>
  #board { position: absolute; left: 50%; top: 54%; transform: translate(-50%, -50%); width: 760px; height: 760px; background: #2a1830; border-radius: 28px; padding: 20px; }
  .tile { position: absolute; width: 167px; height: 167px; border-radius: 18px; display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 64px; left: 0; top: 0; transition: transform .12s ease; will-change: transform; }
  .tile.new { animation: pop .18s ease; } .tile.merged { animation: pop .2s ease; }
  @keyframes pop { 0% { scale: .6; } 60% { scale: 1.12; } 100% { scale: 1; } }
  .cell { position: absolute; width: 167px; height: 167px; border-radius: 18px; background: #ffffff0d; }
  #title { position: absolute; top: 40px; left: 0; right: 0; text-align: center; font-size: 72px; font-weight: 900; margin: 0;
    background: linear-gradient(90deg, #ff4d8d, #a855f7); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #side { position: absolute; right: 120px; top: 50%; transform: translateY(-50%); font-size: 36px; line-height: 1.8; text-align: right; }
  #help { position: absolute; left: 120px; top: 50%; transform: translateY(-50%); font-size: 28px; color: #c9b4c4; line-height: 1.7; max-width: 420px; }
</style></head>
<body>
<h1 id="title">Berry Merge</h1>
<div id="help" data-i18n-html>Slide with ◀ ▶ ▲ ▼.<br>Matching numbers merge.<br>Reach <b>2048</b> to win the golden berry!<br><br>⏯ Play: restart<br>Back: exit</div>
<div id="side"><div id="score">Score 0</div><div id="best">Best 0</div></div>
<div id="board"></div>
<div class="overlay hidden" id="ov"><h1 id="ov-title">Game over</h1><p class="big" id="ov-msg"></p><p class="keys" data-i18n>OK: new game · Back: exit</p></div>
<script src="/shared/i18n.js"></script>
<script src="common.js"></script>
<script>
'use strict';
const N = 4, S = 167, GAP = 14;
const COL = { 2: '#ffd6e5', 4: '#ffb3cf', 8: '#ff8fb5', 16: '#ff6b9b', 32: '#ff4d8d', 64: '#e0115f', 128: '#c026d3', 256: '#a855f7', 512: '#7c3aed', 1024: '#6d28d9', 2048: '#f5b301' };
let grid, score, over, id = 0;
const board = PV.$('#board');
for (let i = 0; i < N * N; i++) { const c = document.createElement('div'); c.className = 'cell'; c.style.left = 20 + (i % N) * (S + GAP) + 'px'; c.style.top = 20 + Math.floor(i / N) * (S + GAP) + 'px'; board.append(c); }
function empty() { const e = []; grid.forEach((row, y) => row.forEach((t, x) => { if (!t) e.push([x, y]); })); return e; }
function spawn() { const e = empty(); if (!e.length) return; const [x, y] = e[Math.floor(Math.random() * e.length)]; grid[y][x] = { v: Math.random() < 0.9 ? 2 : 4, id: ++id, isNew: true }; }
function newGame() { grid = Array.from({ length: N }, () => Array(N).fill(null)); score = 0; over = false; spawn(); spawn(); draw(); PV.$('#ov').classList.add('hidden'); }
function move(dir) {
  if (over) return;
  let moved = false;
  const vec = { left: [-1, 0], right: [1, 0], up: [0, -1], down: [0, 1] }[dir]; if (!vec) return;
  const order = [...Array(N).keys()]; if (vec[0] === 1 || vec[1] === 1) order.reverse();
  grid.flat().forEach((t) => { if (t) { t.merged = false; t.isNew = false; } });
  for (const a of order) for (const b of order) {
    const x = vec[0] ? b : a, y = vec[0] ? a : b; const t = grid[y][x]; if (!t) continue;
    let nx = x, ny = y;
    while (true) {
      const tx = nx + vec[0], ty = ny + vec[1];
      if (tx < 0 || ty < 0 || tx >= N || ty >= N) break;
      const o = grid[ty][tx];
      if (!o) { nx = tx; ny = ty; continue; }
      if (o.v === t.v && !o.merged) { nx = tx; ny = ty; }
      break;
    }
    if (nx === x && ny === y) continue;
    const target = grid[ny][nx]; grid[y][x] = null; moved = true;
    if (target) { target.v *= 2; target.merged = true; score += target.v; } else grid[ny][nx] = t;
  }
  if (moved) spawn();
  draw();
  if (!canMove()) { over = true; PV.best('merge', score); PV.$('#ov-title').textContent = t('Game over'); PV.$('#ov-msg').textContent = t('{n} points', { n: score }); PV.$('#ov').classList.remove('hidden'); }
  else if (grid.flat().some((t) => t && t.v === 2048) && !won) { won = true; PV.$('#ov-title').textContent = t('🏆 Golden berry!'); PV.$('#ov-msg').textContent = t('You reached 2048'); PV.$('#ov').classList.remove('hidden'); }
}
let won = false;
function canMove() {
  if (empty().length) return true;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { const v = grid[y][x].v; if ((x < N - 1 && grid[y][x + 1].v === v) || (y < N - 1 && grid[y + 1][x].v === v)) return true; }
  return false;
}
function draw() {
  const keep = new Set();
  grid.forEach((row, y) => row.forEach((t, x) => {
    if (!t) return; keep.add('t' + t.id);
    let el = document.getElementById('t' + t.id);
    if (!el) { el = document.createElement('div'); el.id = 't' + t.id; board.append(el); }
    el.className = 'tile' + (t.isNew ? ' new' : '') + (t.merged ? ' merged' : '');
    el.style.transform = `translate(${20 + x * (S + GAP)}px, ${20 + y * (S + GAP)}px)`;
    el.style.background = COL[t.v] || '#111'; el.style.color = t.v <= 8 ? '#5a1033' : '#fff'; el.style.fontSize = t.v >= 1024 ? '48px' : '64px';
    el.textContent = t.v;
  }));
  [...board.querySelectorAll('.tile')].forEach((e) => { if (!keep.has(e.id)) e.remove(); });
  PV.$('#score').textContent = t('Score {n}', { n: score }); PV.$('#best').textContent = t('Best {n}', { n: Math.max(PV.best('merge'), score) });
}
PV.onPress((k) => {
  const shown = !PV.$('#ov').classList.contains('hidden');
  if (k === 'ok') { if (over) newGame(); else if (shown) PV.$('#ov').classList.add('hidden'); return; }
  if (k === 'pause') { newGame(); return; }   // Play/Pause on the remote = restart
  if (!shown) move(k);
});
newGame();
</script>
</body>
</html>
