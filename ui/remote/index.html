<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/remote/manifest.webmanifest">
<title>PiVista Remote</title>
<link rel="stylesheet" href="/remote/remote.css">
</head>
<body>
<!-- pairing -->
<main id="pair-view" class="view">
  <div class="logo"><span class="dot"></span><span>Pi<b>Vista</b></span></div>
  <p class="lead">Scan the dot pattern on your TV with your phone camera, or type the 6-digit code shown on screen.</p>
  <input id="code" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code">
  <button id="pair-btn" class="primary">Pair</button>
  <p id="pair-err" class="err"></p>
</main>

<!-- remote -->
<main id="remote-view" class="view hidden">
  <header>
    <div class="logo small"><span class="dot"></span><span>Pi<b>Vista</b></span></div>
    <span id="conn" class="conn">connecting…</span>
  </header>

  <nav class="tabs">
    <button data-tab="pad" class="active">Remote</button>
    <button data-tab="touch">Touchpad</button>
    <button data-tab="apps">Apps</button>
  </nav>

  <section id="tab-pad" class="tab">
    <div class="quick">
      <button data-key="back" class="round">↩<small>Back</small></button>
      <button data-key="home" class="round">⌂<small>Home</small></button>
      <button data-key="playpause" class="round">⏯<small>Play</small></button>
    </div>
    <div class="dpad">
      <button data-key="up" class="d up">▲</button>
      <button data-key="left" class="d left">◀</button>
      <button data-key="ok" class="ok">OK</button>
      <button data-key="right" class="d right">▶</button>
      <button data-key="down" class="d down">▼</button>
    </div>
    <div class="vol">
      <button data-vol="down">−</button><button data-vol="mute">🔇</button><button data-vol="up">+</button>
    </div>
    <div class="kbd">
      <input id="type" placeholder="Type on TV…" autocomplete="off" autocapitalize="off" enterkeyhint="send">
      <button id="bksp">⌫</button>
    </div>
  </section>

  <section id="tab-touch" class="tab hidden">
    <div id="pad" class="touchpad"><span>Drag to move · tap to click · two fingers to scroll</span></div>
    <div class="quick">
      <button data-key="back" class="round">↩<small>Back</small></button>
      <button data-key="home" class="round">⌂<small>Home</small></button>
      <button data-key="space" class="round">␣<small>Space</small></button>
    </div>
  </section>

  <section id="tab-apps" class="tab hidden">
    <div id="apps" class="apps"></div>
    <button id="unpair" class="link">Unpair this phone</button>
  </section>
</main>
<script src="/remote/remote.js"></script>
</body>
</html>
